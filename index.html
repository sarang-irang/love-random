<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>번호 뽑기 ♡</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#f28bb4">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="번호 뽑기">
<link rel="apple-touch-icon" href="./icon-192.png">

<!-- 폰트 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dongle:wght@400;700&display=swap" rel="stylesheet">

<!-- 이미지 저장 -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Dongle',sans-serif;
  background:linear-gradient(145deg,#fffafd,#fff1f7);
  color:#725963;
  overflow:hidden;
}

/* 배경 하트 */
.hearts{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
}

.bg-heart{
  position:absolute;
  color:#f7cddd;
  opacity:.25;
  animation:float 6s ease-in-out infinite;
}

.bg-heart:nth-child(1){left:5%;top:8%;font-size:50px}
.bg-heart:nth-child(2){left:18%;top:27%;font-size:30px}
.bg-heart:nth-child(3){left:7%;top:65%;font-size:42px}
.bg-heart:nth-child(4){left:22%;top:84%;font-size:54px}
.bg-heart:nth-child(5){left:43%;top:5%;font-size:32px}
.bg-heart:nth-child(6){left:49%;top:88%;font-size:38px}
.bg-heart:nth-child(7){right:7%;top:10%;font-size:52px}
.bg-heart:nth-child(8){right:20%;top:30%;font-size:31px}
.bg-heart:nth-child(9){right:5%;top:61%;font-size:43px}
.bg-heart:nth-child(10){right:18%;top:82%;font-size:30px}
.bg-heart:nth-child(11){left:30%;top:50%;font-size:25px}
.bg-heart:nth-child(12){right:31%;top:17%;font-size:27px}

.bg-heart:nth-child(2n){
  animation-duration:7.5s;
  animation-delay:-2s;
}

.bg-heart:nth-child(3n){
  animation-duration:5.5s;
  animation-delay:-3s;
}

@keyframes float{
  0%{transform:translateY(8px)}
  50%{transform:translateY(-17px)}
  100%{transform:translateY(8px)}
}

/* 카드 */
.card{
  width:min(92vw,430px);
  max-height:94vh;
  overflow-y:auto;
  background:rgba(255,255,255,.95);
  border:1px solid #ffd6e6;
  border-radius:30px;
  padding:34px 25px;
  text-align:center;
  box-shadow:0 18px 50px rgba(219,130,164,.18);
  position:relative;
  z-index:2;
}

h1{
  margin:0 0 8px;
  color:#e96f9f;
  font-size:43px;
  line-height:1.1;
  font-weight:700;
}

p{
  margin:8px 0 20px;
  color:#a58491;
  font-size:27px;
  line-height:1.2;
}

/* 범위 */
.range{
  display:flex;
  align-items:center;
  gap:10px;
  margin:22px 0 16px;
}

.range span{
  font-size:30px;
  color:#c293a5;
}

input{
  width:100%;
  min-width:0;
  padding:10px 8px;
  border:1.5px solid #ffd0e2;
  border-radius:16px;
  background:#fff9fb;
  text-align:center;
  font-family:'Dongle',sans-serif;
  font-size:31px;
  color:#725963;
  outline:none;
}

input:focus{
  border-color:#f3a1c0;
}

/* 제외 번호 */
.exclude-wrap{
  margin:0 0 14px;
}

.exclude-label{
  display:block;
  text-align:left;
  margin-bottom:5px;
  font-size:23px;
  color:#a58491;
}

#excludeNums{
  font-size:26px;
}

/* 중복 설정 */
.duplicate-setting{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:7px 0 20px;
  padding:12px 15px;
  background:#fff7fa;
  border:1px solid #ffe0eb;
  border-radius:16px;
}

.duplicate-text{
  font-size:25px;
  color:#9e7b88;
  line-height:1;
}

/* 스위치 */
.switch{
  position:relative;
  width:52px;
  height:29px;
  flex-shrink:0;
}

.switch input{
  opacity:0;
  width:0;
  height:0;
}

.slider{
  position:absolute;
  inset:0;
  cursor:pointer;
  background:#f3d5e0;
  border-radius:30px;
  transition:.25s;
}

.slider:before{
  content:"";
  position:absolute;
  width:23px;
  height:23px;
  left:3px;
  top:3px;
  background:white;
  border-radius:50%;
  box-shadow:0 2px 5px rgba(0,0,0,.12);
  transition:.25s;
}

.switch input:checked + .slider{
  background:#f28bb4;
}

.switch input:checked + .slider:before{
  transform:translateX(23px);
}

/* 버튼 */
button{
  width:100%;
  border:0;
  border-radius:18px;
  padding:11px;
  background:#f28bb4;
  color:white;
  font-family:'Dongle',sans-serif;
  font-size:31px;
  line-height:1.15;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 7px 16px rgba(242,139,180,.25);
}

button:active{
  transform:scale(.98);
}

button:disabled{
  opacity:.65;
}

.small{
  margin-top:10px;
  background:#fff0f6;
  color:#d76d98;
  box-shadow:none;
  font-size:28px;
}

/* 결과 */
#resultScreen{
  display:none;
}

.resultBox{
  height:190px;
  margin:22px 0 18px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:2px dashed #ffc4db;
  border-radius:28px;
  background:#fff5f9;
}

#resultNumber{
  font-size:135px;
  line-height:1;
  font-weight:700;
  color:#ee75a5;
  text-shadow:0 5px 0 #ffe0eb;
}

.meta{
  margin-top:10px;
  color:#aa8c97;
  font-size:23px;
  line-height:1.2;
}

/* 기록 */
#history{
  margin-top:16px;
  padding:13px 10px;
  max-height:150px;
  overflow-y:auto;
  background:#fff8fb;
  border-radius:16px;
  color:#a7788a;
  font-size:24px;
  line-height:1.45;
}

/* 하트 효과 */
.burst-heart{
  position:fixed;
  left:50%;
  top:50%;
  pointer-events:none;
  color:#f5b8cf;
  z-index:999;
  animation:burst 1.8s ease-out forwards;
}

@keyframes burst{
  0%{
    opacity:.8;
    transform:
      translate(-50%,-50%)
      translate(0,0)
      scale(.5);
  }

  25%{
    opacity:.7;
  }

  100%{
    opacity:0;
    transform:
      translate(-50%,-50%)
      translate(var(--x),var(--y))
      rotate(var(--r))
      scale(1.4);
  }
}
</style>
</head>

<body>

<div class="hearts">
  <div class="bg-heart">♥</div>
  <div class="bg-heart">♥</div>
  <div class="bg-heart">♥</div>
  <div class="bg-heart">♥</div>
  <div class="bg-heart">♥</div>
  <div class="bg-heart">♥</div>
  <div class="bg-heart">♥</div>
  <div class="bg-heart">♥</div>
  <div class="bg-heart">♥</div>
  <div class="bg-heart">♥</div>
  <div class="bg-heart">♥</div>
  <div class="bg-heart">♥</div>
</div>

<main class="card" id="mainCard">

<!-- 첫 화면 -->
<section id="drawScreen">

  <h1>⊹˚♡ 번호 뽑기 ♡˚⊹</h1>

  <p>원하는 숫자 범위를 입력한 뒤 뽑아주세요</p>

  <form id="drawForm">

    <div class="range">

      <input
        id="minNum"
        type="number"
        value="1"
        required
      >

      <span>~</span>

      <input
        id="maxNum"
        type="number"
        value="100"
        required
      >

    </div>

    <div class="exclude-wrap">

      <label
        class="exclude-label"
        for="excludeNums"
      >
        제외할 번호
      </label>

      <input
        id="excludeNums"
        type="text"
        placeholder="예: 3, 7, 12"
      >

    </div>

    <!-- 중복 방지 -->
    <div class="duplicate-setting">

      <span class="duplicate-text">
        중복 없이 뽑기
      </span>

      <label class="switch">

        <input
          id="noDuplicate"
          type="checkbox"
        >

        <span class="slider"></span>

      </label>

    </div>

    <button type="submit">
      번호 뽑기
    </button>

  </form>

</section>


<!-- 결과 화면 -->
<section id="resultScreen">

  <h1>⊹˚♡ 뽑힌 번호 ♡˚⊹</h1>

  <div class="resultBox">
    <div id="resultNumber">?</div>
  </div>

  <button
    id="againBtn"
    type="button"
  >
    한 번 더 뽑기
  </button>

  <button
    id="saveBtn"
    type="button"
    class="small"
  >
    결과 이미지 저장
  </button>

  <button
    id="changeBtn"
    type="button"
    class="small"
  >
    범위 다시 정하기
  </button>

  <div
    class="meta"
    id="rangeText"
  ></div>

  <div
    class="meta"
    id="excludeText"
  ></div>

  <div
    class="meta"
    id="duplicateText"
  ></div>

  <div id="history"></div>

</section>

</main>


<script>
(function(){

  const drawScreen =
    document.getElementById("drawScreen");

  const resultScreen =
    document.getElementById("resultScreen");

  const resultNumber =
    document.getElementById("resultNumber");

  const minInput =
    document.getElementById("minNum");

  const maxInput =
    document.getElementById("maxNum");

  const excludeInput =
    document.getElementById("excludeNums");

  const noDuplicateInput =
    document.getElementById("noDuplicate");

  const rangeText =
    document.getElementById("rangeText");

  const excludeText =
    document.getElementById("excludeText");

  const duplicateText =
    document.getElementById("duplicateText");

  const history =
    document.getElementById("history");

  const saveBtn =
    document.getElementById("saveBtn");

  const mainCard =
    document.getElementById("mainCard");


  let currentMin = 1;
  let currentMax = 100;

  let excludedNumbers = [];

  let results = [];

  let noDuplicate = false;


  /* 제외 번호 */
  function parseExcludedNumbers(){

    const text =
      excludeInput.value.trim();

    if(!text){
      return [];
    }

    return [...new Set(
      text
        .split(/[,\s]+/)
        .map(Number)
        .filter(function(n){
          return Number.isInteger(n);
        })
    )];

  }


  /* 현재 뽑을 수 있는 번호 */
  function getAvailableNumbers(){

    const available = [];

    for(
      let i=currentMin;
      i<=currentMax;
      i++
    ){

      /* 사용자가 직접 제외한 번호 */
      if(
        excludedNumbers.includes(i)
      ){
        continue;
      }

      /* 중복 없이 뽑기 활성화 시
         이미 나온 번호도 제외 */
      if(
        noDuplicate
        &&
        results.includes(i)
      ){
        continue;
      }

      available.push(i);

    }

    return available;

  }


  /* 랜덤 선택 */
  function randomFromArray(array){

    const index =
      Math.floor(
        Math.random() * array.length
      );

    return array[index];

  }


  /* 하트 와르르 */
  function heartBurst(){

    for(let i=0; i<35; i++){

      const heart =
        document.createElement("div");

      heart.className =
        "burst-heart";

      heart.textContent =
        "♥";

      const angle =
        Math.random()
        * Math.PI
        * 2;

      const distance =
        90
        + Math.random()
        * 250;

      const x =
        Math.cos(angle)
        * distance;

      const y =
        Math.sin(angle)
        * distance;

      heart.style.setProperty(
        "--x",
        x + "px"
      );

      heart.style.setProperty(
        "--y",
        y + "px"
      );

      heart.style.setProperty(
        "--r",
        (Math.random()*80-40)
        + "deg"
      );

      heart.style.fontSize =
        (18 + Math.random()*30)
        + "px";

      heart.style.animationDuration =
        (1.3 + Math.random()*.8)
        + "s";

      document.body.appendChild(
        heart
      );

      setTimeout(
        function(){
          heart.remove();
        },
        2300
      );

    }

  }


  /* 기록 */
  function updateHistory(){

    let text = "";

    results.forEach(
      function(number,index){

        text +=
          (index+1)
          + "번째 추첨 결과 : "
          + number
          + "<br>";

      }
    );

    history.innerHTML =
      text;

  }


  /* 번호 뽑기 */
  function showResult(){

    const available =
      getAvailableNumbers();


    if(
      available.length === 0
    ){

      if(noDuplicate){

        alert(
          "모든 번호를 다 뽑았어요 ♡\n범위를 다시 정해주세요!"
        );

      }else{

        alert(
          "뽑을 수 있는 번호가 없어요 ♡"
        );

      }

      return;

    }


    const picked =
      randomFromArray(
        available
      );


    resultNumber.textContent =
      picked;


    results.push(
      picked
    );


    updateHistory();


    rangeText.textContent =
      "현재 범위 : "
      + currentMin
      + " ~ "
      + currentMax;


    if(
      excludedNumbers.length > 0
    ){

      excludeText.textContent =
        "제외 번호 : "
        + excludedNumbers.join(", ");

    }else{

      excludeText.textContent =
        "";

    }


    if(noDuplicate){

      duplicateText.textContent =
        "중복 없이 뽑는 중 ♡";

    }else{

      duplicateText.textContent =
        "";

    }


    drawScreen.style.display =
      "none";

    resultScreen.style.display =
      "block";


    heartBurst();

  }


  /* 첫 추첨 */
  document
    .getElementById("drawForm")
    .addEventListener(
      "submit",
      function(e){

        e.preventDefault();


        const min =
          Number(minInput.value);

        const max =
          Number(maxInput.value);


        if(
          !Number.isInteger(min)
          ||
          !Number.isInteger(max)
        ){

          alert(
            "정수를 입력해주세요 ♡"
          );

          return;

        }


        if(min > max){

          alert(
            "시작 숫자는 끝 숫자보다 작거나 같아야 해요 ♡"
          );

          return;

        }


        currentMin = min;
        currentMax = max;


        excludedNumbers =
          parseExcludedNumbers()
          .filter(
            function(n){

              return (
                n >= currentMin
                &&
                n <= currentMax
              );

            }
          );


        noDuplicate =
          noDuplicateInput.checked;


        results = [];


        if(
          getAvailableNumbers().length
          === 0
        ){

          alert(
            "범위 안의 모든 번호가 제외되어 있어요 ♡"
          );

          return;

        }


        showResult();

      }
    );


  /* 한 번 더 */
  document
    .getElementById("againBtn")
    .addEventListener(
      "click",
      showResult
    );


  /* 범위 다시 정하기 */
  document
    .getElementById("changeBtn")
    .addEventListener(
      "click",
      function(){

        results = [];

        history.innerHTML = "";

        resultScreen.style.display =
          "none";

        drawScreen.style.display =
          "block";

      }
    );


  /* 결과 이미지 저장 */
  saveBtn.addEventListener(
    "click",
    async function(){

      try{

        saveBtn.disabled = true;
        saveBtn.textContent =
          "이미지 만드는 중...";


        const againBtn =
          document.getElementById("againBtn");

        const changeBtn =
          document.getElementById("changeBtn");


        /* 저장 이미지에는 버튼 제외 */
        againBtn.style.display =
          "none";

        changeBtn.style.display =
          "none";

        saveBtn.style.display =
          "none";


        const canvas =
          await html2canvas(
            mainCard,
            {
              scale:2,
              backgroundColor:"#fffafd",
              useCORS:true
            }
          );


        againBtn.style.display =
          "";

        changeBtn.style.display =
          "";

        saveBtn.style.display =
          "";


        const blob =
          await new Promise(
            function(resolve){

              canvas.toBlob(
                resolve,
                "image/png"
              );

            }
          );


        if(!blob){

          throw new Error(
            "이미지 생성 실패"
          );

        }


        const file =
          new File(
            [blob],
            "번호뽑기_결과.png",
            {
              type:"image/png"
            }
          );


        /* 모바일 공유 */
        if(
          navigator.share
          &&
          navigator.canShare
          &&
          navigator.canShare({
            files:[file]
          })
        ){

          await navigator.share({
            files:[file],
            title:"번호 뽑기 결과"
          });

        }

        /* PC 다운로드 */
        else{

          const url =
            URL.createObjectURL(
              blob
            );

          const link =
            document.createElement(
              "a"
            );

          link.href =
            url;

          link.download =
            "번호뽑기_결과.png";

          document.body.appendChild(
            link
          );

          link.click();

          link.remove();


          setTimeout(
            function(){

              URL.revokeObjectURL(
                url
              );

            },
            1000
          );

        }

      }

      catch(error){

        if(
          error.name !== "AbortError"
        ){

          alert(
            "이미지 저장 중 오류가 발생했어요 ㅠㅠ"
          );

          console.error(
            error
          );

        }

      }

      finally{

        document
          .getElementById("againBtn")
          .style.display = "";

        document
          .getElementById("changeBtn")
          .style.display = "";

        saveBtn.style.display = "";

        saveBtn.disabled = false;

        saveBtn.textContent =
          "결과 이미지 저장";

      }

    }
  );


})();
</script>


<!-- PWA -->
<script>
if("serviceWorker" in navigator){

  window.addEventListener(
    "load",
    function(){

      navigator
        .serviceWorker
        .register("./sw.js");

    }
  );

}
</script>

</body>
</html>
